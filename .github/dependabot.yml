version: 2

# Minor and patch updates come together; a major one gets its own pull request, since it may need code changes.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm:
        update-types: [minor, patch]

  # The digests of the base images.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/test
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
