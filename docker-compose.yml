services:
  # The database of the product
  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    container_name: betterbus-postgres
    hostname: betterbus-postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${BETTERBUS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - betterbus-network
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U postgres
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
    name: betterbus-postgres-data


networks:
  betterbus-network:
    driver: bridge
    name: betterbus-network